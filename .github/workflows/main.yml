# Builds the project, publishes the browser-only demo to GitHub Pages, and
# publishes the binary as a rolling `latest` release.
#
# The demo needs no backend (see README § Demo mode), so the whole site is the
# static bundle `-demo-bundle` writes. Both are published only from main, and
# only after ./build.sh has passed — which includes the frontend tests, the Go
# tests, and the linter — so a broken commit never reaches either.
name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Overrides the workflow default only to add contents: write, which the
    # release step needs to move the `latest` tag and upload the binary.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # build.sh expects these on $PATH and never installs anything itself (see
      # AGENTS.md). govulncheck is not a build.sh tool, it is run by
      # the next step, but its pin belongs with the others.
      - name: Install build tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      # Silent on success; on failure it prints the failing step and exits
      # non-zero, which fails the job before anything is published.
      - name: Build
        run: ./verify.sh

      # Ahead of the release step, so a build with a known vulnerability reachable
      # from this code is never published. In the default source mode only
      # reachable symbols fail the job; a vulnerability in a module we merely
      # require is reported and ignored. This catches new advisories against
      # unchanged code too, but only when something is pushed, which is why the
      # weekly scan in govulncheck.yml exists alongside it.
      - name: Check for known vulnerabilities
        run: govulncheck ./...
